site_name: Hospital Digitalisation Handbook
site_description: A field guide to deploying an open-source hospital information system in a resource-limited hospital
site_author: AUCOOP
copyright: Copyright &copy; 2026 AUCOOP (https://aucoop.upc.edu)

# Starts under Pol's profile alongside the deployment repos; transfer to the
# aucoop organisation later (Settings → Danger Zone → Transfer) and update these
# three lines when that happens.
repo_url: https://github.com/polgimenezcolom-sys/Hospital-Digitalisation-Handbook
repo_name: polgimenezcolom-sys/Hospital-Digitalisation-Handbook
edit_uri: edit/main/docs/
site_url: https://polgimenezcolom-sys.github.io/Hospital-Digitalisation-Handbook/

theme:
  name: material
  custom_dir: overrides
  language: en
  logo: assets/logo.svg
  favicon: assets/logo.svg
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  icon:
    repo: fontawesome/brands/github
    admonition:
      danger: material/hand-back-left
      warning: material/archive
      tip: material/compass
      note: material/book-open-variant
  features:
    # The whole book stays visible in the left sidebar on every page.
    # navigation.sections renders each part as a heading with its pages always
    # listed — without it, Material "drills down" into a section and hides the
    # rest of the book behind a back arrow.
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.top
    - navigation.footer
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - content.action.edit
    - content.code.copy
    - toc.follow
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - def_list
  - toc:
      permalink: true

plugins:
  - search

extra:
  version: "0.2"
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/aucoop
    - icon: fontawesome/solid/globe
      link: https://aucoop.upc.edu
  network_handbook: https://aucoop.github.io/Community-Network-Handbook/

nav:
  - Home: index.md
  - Introduction:
      - 1-Introduction/index.md
      - Why this handbook exists: 1-Introduction/1.1-Motivation.md
      - Who this is for: 1-Introduction/1.2-Who-This-Is-For.md
      - How to use it: 1-Introduction/1.3-How-To-Use-It.md
  - The Story:
      - 2-Story/index.md
      - "1 · Nobody can find what happened last time": 2-Story/2.01-Last-Time-She-Came.md
      - "2 · Which of these forms actually matters?": 2-Story/2.02-Which-Forms-Matter.md
      - "3 · Should we be deploying this at all?": 2-Story/2.03-Should-We-Deploy.md
      - "4 · Nobody told the nurses": 2-Story/2.04-Nobody-Told-The-Nurses.md
      - "5 · The power went out mid-consultation": 2-Story/2.05-Power-Went-Out.md
      - "6 · It works here but not in Emergency": 2-Story/2.06-Not-In-Emergency.md
      - "7 · The pharmacist says paper is faster": 2-Story/2.07-Paper-Is-Faster.md
      - "8 · They're doing both now": 2-Story/2.08-Doing-Both.md
      - "9 · The return is due on the 5th": 2-Story/2.09-Due-On-The-Fifth.md
      - "10 · I'm in Barcelona and I can't reach it": 2-Story/2.10-Cant-Reach-It.md
      - "11 · Nobody used it after we left": 2-Story/2.11-Nobody-Used-It.md
      - "12 · We never wrote down what we did": 2-Story/2.12-Never-Wrote-It-Down.md
  - The Guide:
      - 3-Guide/index.md
      - Assessing the hospital: 3-Guide/Assessment.md
      - Choosing the platform: 3-Guide/Choosing-Platform.md
      - Power and UPS: 3-Guide/Power.md
      - Network and connectivity: 3-Guide/Network.md
      - Server and backup: 3-Guide/Server.md
      - Remote support: 3-Guide/Remote-Support.md
      - Bahmni deployment: 3-Guide/Bahmni.md
      - GNU Health deployment: 3-Guide/GNU-Health.md
      - Training by role: 3-Guide/Training.md
  - The Instruments:
      - 4-Instruments/index.md
      - B-1 · Readiness assessment: 4-Instruments/B1-Readiness.md
      - B-2 · Level decision: 4-Instruments/B2-Level-Decision.md
      - B-3 · Mandate and ownership: 4-Instruments/B3-Mandate.md
      - D-1 · Field data capture: 4-Instruments/D1-Data-Capture.md
      - D-2 · Infrastructure audit: 4-Instruments/D2-Infrastructure-Audit.md
      - D-3 · Workflow mapping: 4-Instruments/D3-Workflow-Mapping.md
      - D-4 · Phase exit gates: 4-Instruments/D4-Exit-Gates.md
      - L-1 · Handover pack: 4-Instruments/L1-Handover-Pack.md
      - A-1 · Debrief and feedback: 4-Instruments/A1-Debrief.md
  - Real Deployments:
      - 5-Real-Deployments/index.md
      - Lunsar, Sierra Leone: 5-Real-Deployments/5.1-Lunsar.md
      - Yassa–Douala, Cameroon: 5-Real-Deployments/5.2-Douala.md
  - Glossary: glossary.md
  - Contributing:
      - contributing/index.md
      - Case study template: contributing/case-study.md
